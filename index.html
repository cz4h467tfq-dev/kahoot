<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Lebanon Unlocked – The Ultimate Lebanese Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Montserrat,system-ui,sans-serif;background:#46178f;color:#fff;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#bg i{position:absolute;opacity:.07;animation:float linear infinite}
@keyframes float{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(360deg)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
.screen{position:relative;z-index:1;min-height:100vh;display:none;flex-direction:column;padding:16px;gap:14px;max-width:1100px;margin:0 auto}
.screen.on{display:flex;animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.center{align-items:center;justify-content:center;text-align:center}
.logo{font-weight:900;font-size:clamp(42px,9vw,84px);line-height:.92;letter-spacing:-1px;text-shadow:0 6px 0 rgba(0,0,0,.25)}
.logo span{color:#2fd35a;display:block}
.tag{opacity:.9;font-weight:700}
.card{background:#fff;color:#333;border-radius:12px;padding:20px;width:min(560px,94vw);box-shadow:0 6px 0 rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px}
.card h3{font-size:14px;text-transform:uppercase;letter-spacing:1px;color:#46178f;text-align:left}
input{font:inherit;font-weight:800;font-size:20px;padding:14px;border:3px solid #ddd;border-radius:8px;text-align:center;outline:none;width:100%}
input:focus{border-color:#46178f}
.btn{font:inherit;font-weight:800;font-size:19px;padding:14px 22px;border:0;border-radius:8px;background:#333;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.light{background:#fff;color:#46178f}
.btn.green{background:#26890c}
.btn.ghost{background:rgba(0,0,0,.25)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{border:3px solid #eee;border-radius:10px;padding:10px 6px;cursor:pointer;text-align:center;font-weight:800;color:#333;background:#fafafa}
.mode b{display:block;font-size:26px}
.mode small{display:block;font-weight:600;color:#888;font-size:11px;margin-top:2px}
.mode.sel{border-color:#46178f;background:#f1eaff}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{border:2px solid #ddd;border-radius:30px;padding:7px 12px;font-weight:700;font-size:14px;cursor:pointer;background:#fff;color:#444}
.chip.sel{background:#46178f;border-color:#46178f;color:#fff}
.stats{font-size:13px;font-weight:600;opacity:.85}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:800;gap:8px;flex-wrap:wrap}
.pill{background:rgba(0,0,0,.25);padding:8px 14px;border-radius:30px;font-size:15px}
.qbox{background:#fff;color:#222;border-radius:10px;padding:20px 16px;text-align:center;font-weight:800;font-size:clamp(19px,3.4vw,32px);box-shadow:0 4px 0 rgba(0,0,0,.2);position:relative}
.qbox .cat{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#864cbf;color:#fff;font-size:12px;padding:4px 12px;border-radius:20px;white-space:nowrap}
.qbox .emo{display:block;font-size:clamp(44px,8vw,70px);margin-bottom:6px}
.mid{flex:1;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:110px}
.timer{width:92px;height:92px;border-radius:50%;background:#864cbf;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.25);flex:none}
.timer.low{background:#e21b3c;animation:pulse .5s infinite alternate}
.timer.frozen{background:#1368ce}
@keyframes pulse{to{transform:scale(1.08)}}
.powers{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pw{font:inherit;font-weight:800;font-size:14px;border:0;border-radius:30px;padding:10px 14px;background:#fff;color:#46178f;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.pw:disabled{opacity:.3;cursor:default}
.pw.active{background:#ffd23f}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ans{position:relative;border:0;border-radius:8px;min-height:92px;padding:14px 46px 14px 64px;color:#fff;font:inherit;font-weight:800;font-size:clamp(15px,2.4vw,22px);text-align:left;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.3);transition:opacity .25s,transform .1s;animation:in .3s backwards}
.ans:nth-child(2){animation-delay:.05s}.ans:nth-child(3){animation-delay:.1s}.ans:nth-child(4){animation-delay:.15s}
@keyframes in{from{opacity:0;transform:scale(.9)}}
.ans:active{transform:translateY(3px)}
.ans svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:34px;height:34px}
.c0{background:#e21b3c}.c1{background:#1368ce}.c2{background:#d89e00}.c3{background:#26890c}
.answers.tf .ans{min-height:150px;font-size:clamp(22px,4vw,34px)}
.ans.dim{opacity:.22}
.ans.gone{visibility:hidden}
.ans.right::after{content:"✔";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:28px}
.ans.wrong::after{content:"✖";position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:28px}
.ans:disabled{cursor:default}
.bar{height:8px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;width:100%}
#fb{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center;z-index:10;padding:20px}
#fb.on{display:flex;animation:pop .25s}
#fb.ok{background:#26890c}#fb.no{background:#e21b3c}
@keyframes pop{from{opacity:0;transform:scale(1.08)}}
#fb h2{font-size:clamp(36px,8vw,64px);font-weight:900}
#fb .pts{background:rgba(0,0,0,.25);padding:10px 22px;border-radius:8px;font-size:24px;font-weight:900}
#fb .fact{max-width:560px;font-weight:600;opacity:.95}
#fb .rank{font-weight:800;background:#fff;color:#333;padding:8px 18px;border-radius:30px}
.big{font-size:clamp(54px,12vw,100px);font-weight:900;text-shadow:0 6px 0 rgba(0,0,0,.25)}
.count{font-size:130px;font-weight:900;animation:pop .4s}
.board{width:min(560px,94vw);display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;background:#fff;color:#333;border-radius:8px;padding:10px 14px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.2);animation:in .3s backwards}
.row .r{width:30px;text-align:center;font-size:18px}
.row .n{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{color:#46178f}
.row small{color:#999;font-weight:600;font-size:11px;display:block}
.row.me{background:#ffd23f}
.tabs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.review{width:min(680px,94vw);display:flex;flex-direction:column;gap:6px;text-align:left;max-height:34vh;overflow:auto}
.review div{background:rgba(0,0,0,.2);padding:8px 12px;border-radius:6px;font-size:14px;font-weight:600}
.badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.badge{background:#ffd23f;color:#333;font-weight:800;padding:6px 12px;border-radius:20px;font-size:14px;animation:pop .4s backwards}
.fab{position:fixed;bottom:12px;right:12px;z-index:30;background:rgba(0,0,0,.3);border:0;color:#fff;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer}
.row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@media(max-width:560px){.answers{grid-template-columns:1fr}.ans{min-height:62px}.answers.tf{grid-template-columns:1fr 1fr}.answers.tf .ans{min-height:110px;padding:14px;text-align:center}.answers.tf .ans svg{display:none}.mid{min-height:80px}.timer{width:72px;height:72px;font-size:32px}}
</style>
</head>
<body>
<div id="bg"></div>
<canvas id="confetti"></canvas>

<!-- HOME -->
<section id="s-home" class="screen center on">
  <div class="logo">LEBANON<span>UNLOCKED!</span></div>
  <p class="tag">🇱🇧 The ultimate Lebanese quiz — yalla, prove you're 100% Lebnene</p>
  <div class="card">
    <input id="name" maxlength="16" placeholder="Your nickname" autocomplete="off">
    <h3>Game mode</h3>
    <div class="modes" id="modes"></div>
    <h3>Category</h3>
    <div class="chips" id="cats"></div>
    <button class="btn green" id="go">YALLA! ▶</button>
  </div>
  <div class="row2">
    <button class="btn light" id="hof">🏆 Hall of Fame</button>
  </div>
  <p class="stats" id="stats"></p>
</section>

<!-- COUNTDOWN -->
<section id="s-count" class="screen center"><p class="tag" id="cTitle"></p><div class="count" id="cNum">3</div></section>

<!-- QUESTION -->
<section id="s-q" class="screen">
  <div class="top"><span class="pill" id="qNum"></span><span class="pill" id="streak"></span><span class="pill" id="lives"></span><span class="pill" id="score">0</span></div>
  <div class="qbox" id="qText"></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="mid">
    <div class="timer" id="timer">20</div>
    <div class="powers">
      <button class="pw" id="pw-half" title="Remove two wrong answers">✂️ 50/50</button>
      <button class="pw" id="pw-double" title="Double points on this question">✖️2 Double</button>
      <button class="pw" id="pw-freeze" title="Freeze the timer">❄️ Freeze</button>
    </div>
  </div>
  <div class="answers" id="answers"></div>
</section>

<!-- END -->
<section id="s-end" class="screen center">
  <p class="tag" id="endTitle">Final score</p>
  <div class="big" id="final">0</div>
  <p style="font-weight:800;font-size:20px" id="verdict"></p>
  <div class="badges" id="badges"></div>
  <div class="board" id="endBoard"></div>
  <div class="review" id="review"></div>
  <div class="row2"><button class="btn green" id="again">Play again 🔁</button><button class="btn light" id="home">Home</button></div>
</section>

<!-- HALL OF FAME -->
<section id="s-hof" class="screen center">
  <div class="logo" style="font-size:clamp(34px,7vw,60px)">🏆 HALL<span>OF FAME</span></div>
  <div class="tabs" id="hofTabs"></div>
  <div class="board" id="hofBoard"></div>
  <div class="row2"><button class="btn light" id="hofBack">Back</button><button class="btn ghost" id="hofReset">Reset scores</button></div>
  <p class="stats" id="resetMsg"></p>
</section>

<div id="fb"><h2 id="fbTitle"></h2><div class="pts" id="fbPts"></div><p class="fact" id="fbFact"></p><div class="rank" id="fbRank"></div></div>
<button class="fab" id="mute" title="Sound">🔊</button>

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

/* ================= SOUND ================= */
function actx(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function beep(f,d=.12,type='sine',v=.12,delay=0){if(muted)return;const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(a.destination);const t=a.currentTime+delay;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.02)}
function tune(n,step=.11,type='triangle'){n.forEach((f,k)=>beep(f,.2,type,.13,k*step))}
const RIFF=[220,0,262,0,330,0,262,0,196,0,247,0,294,0,247,0];
function startMusic(fast){stopMusic();let k=0;music=setInterval(()=>{const f=RIFF[k++%RIFF.length];if(f)beep(f,.12,'square',.035);if(k%4===1)beep(110,.1,'sine',.06)},fast?110:150)}
function stopMusic(){clearInterval(music);music=null}

/* ================= CONFETTI ================= */
const cv=$('confetti'),cx=cv.getContext('2d');let parts=[],craf=null;
function confetti(n=180){cv.width=innerWidth;cv.height=innerHeight;const cols=['#e21b3c','#1368ce','#d89e00','#26890c','#fff','#ffd23f'];for(let i=0;i<n;i++)parts.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:6+Math.random()*8,c:cols[i%cols.length]});if(!craf)loop()}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.y<cv.height+30);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});craf=parts.length?requestAnimationFrame(loop):(cx.clearRect(0,0,cv.width,cv.height),null)}

/* ================= HOME ================= */
function renderHome(){
  $('name').value=store.get('name','');
  $('modes').innerHTML=Object.entries(MODES).map(([k,m])=>`<div class="mode ${k===mode?'sel':''}" data-m="${k}"><b>${m.icon}</b>${m.name}<small>${m.desc}</small></div>`).join('');
  $('modes').querySelectorAll('.mode').forEach(d=>d.onclick=()=>{mode=d.dataset.m;store.set('mode',mode);beep(660,.06);renderHome()});
  $('cats').innerHTML=Object.entries(CATS).map(([k,v])=>`<span class="chip ${k===cat?'sel':''}" data-c="${k}">${v}</span>`).join('');
  $('cats').querySelectorAll('.chip').forEach(d=>d.onclick=()=>{cat=d.dataset.c;store.set('cat',cat);beep(660,.06);renderHome()});
  const st=store.get('stats',{games:0,right:0,total:0,best:0});
  const seen=store.get('seen',[]).length;
  $('stats').textContent=st.games?`Games ${st.games} · Accuracy ${Math.round(st.right/st.total*100)}% · Best streak 🔥${st.best} · Seen ${seen}/${BANK.length} questions`:`${BANK.length} questions in the bank — every game is different!`;
}

$('hof').onclick=()=>openHof(mode);$('hofBack').onclick=()=>{renderHome();show('s-home')};
let resetArm=false;
$('hofReset').onclick=()=>{if(!resetArm){resetArm=true;$('resetMsg').textContent='Tap "Reset scores" again to wipe the Hall of Fame on this device.';setTimeout(()=>{resetArm=false;$('resetMsg').textContent=''},4000);return}store.set('board',{});resetArm=false;$('resetMsg').textContent='Hall of Fame cleared.';openHof(hofMode)};
$('mute').onclick=()=>{muted=!muted;store.set('muted',muted);$('mute').textContent=muted?'🔇':'🔊';if(muted)stopMusic();else if(G&&!G.locked)startMusic(mode==='blitz')};
$('mute').textContent=muted?'🔇':'🔊';

/* ================= PICK QUESTIONS (no repeats) ================= */
function pickQuestions(n){
  let pool=BANK.filter(q=>cat==='all'||q.c===cat);
  let seen=new Set(store.get('seen',[]));
  let fresh=pool.filter(q=>!seen.has(q.id));
  if(fresh.length<Math.min(n,pool.length)){ // cycle finished → reset seen for this pool
    pool.forEach(q=>seen.delete(q.id));store.set('seen',[...seen]);fresh=pool;
  }
  let picked=shuffle(fresh).slice(0,n);
  if(picked.length<n&&n<999)picked=picked.concat(shuffle(pool.filter(q=>!picked.includes(q))).slice(0,n-picked.length));
  // spread categories a bit in mixed mode: avoid same cat back-to-back
  for(let i=1;i<picked.length;i++)if(picked[i].c===picked[i-1].c){const j=picked.findIndex((q,k)=>k>i&&q.c!==picked[i-1].c);if(j>0)[picked[i],picked[j]]=[picked[j],picked[i]]}
  return picked;
}
function markSeen(id){const s=store.get('seen',[]);if(!s.includes(id)){s.push(id);store.set('seen',s)}}

/* ================= GAME ================= */
function start(){
  const nm=$('name').value.trim()||'Player';store.set('name',$('name').value.trim());
  const M=MODES[mode];
  const qs=pickQuestions(M.n===999?200:M.n);
  G={name:nm,M,qs,i:0,score:0,streak:0,best:0,right:0,lives:M.lives,log:[],power:{half:1,double:1,freeze:1},dbl:false,frozen:false,locked:true,elapsed:0};
  countdown(`${M.icon} ${M.name} · ${CATS[cat]}`,ask);
}
function countdown(title,cb){show('s-count');$('cTitle').textContent=title;let n=3;const draw=()=>{const el=$('cNum');el.textContent=n;el.style.animation='none';el.offsetHeight;el.style.animation='';beep(400+n*90,.15,'square',.08)};draw();const iv=setInterval(()=>{n--;if(n===0){clearInterval(iv);beep(990,.3,'square',.08);cb()}else draw()},750)}

function ask(){
  const q=G.qs[G.i];G.locked=false;G.dbl=false;G.frozen=false;G.elapsed=0;G.last=performance.now();G.q=q;
  const M=G.M;
  $('qNum').textContent=M.lives?`Q ${G.i+1}`:`${G.i+1} / ${G.qs.length}`;
  $('score').textContent=G.score.toLocaleString();
  $('streak').textContent='🔥 '+G.streak;$('streak').style.display=G.streak>1?'':'none';
  $('lives').textContent='❤️'.repeat(G.lives)+'🖤'.repeat(Math.max(0,M.lives-G.lives));$('lives').style.display=M.lives?'':'none';
  $('qText').innerHTML=`<span class="cat">${CATS[q.c]}</span>${q.e?`<span class="emo">${q.e}</span>`:''}${esc(q.q)}`;
  let opts,box=$('answers');
  if('t' in q){opts=[{txt:'True',ok:q.t===true,col:1,sh:1},{txt:'False',ok:q.t===false,col:0,sh:0}];box.className='answers tf'}
  else{opts=shuffle([{txt:q.a,ok:true},...shuffle(q.w).slice(0,3).map(t=>({txt:t,ok:false}))]).map((o,k)=>({...o,col:k,sh:k}));box.className='answers'}
  G.opts=opts;
  box.innerHTML=opts.map((o,k)=>`<button class="ans c${o.col}" data-k="${k}">${SHAPES[o.sh]}${esc(o.txt)}</button>`).join('');
  box.querySelectorAll('.ans').forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $('pw-half').disabled=!G.power.half||('t' in q);$('pw-double').disabled=!G.power.double;$('pw-freeze').disabled=!G.power.freeze;
  ['pw-half','pw-double','pw-freeze'].forEach(id=>$(id).classList.remove('active'));
  $('timer').classList.remove('frozen');
  show('s-q');startMusic(mode==='blitz');
  clearInterval(tick);tick=setInterval(update,50);update();
}
$('pw-half').onclick=()=>{if(G.locked||!G.power.half)return;G.power.half=0;$('pw-half').disabled=true;beep(500,.15,'sawtooth',.06);let wrong=[...document.querySelectorAll('.ans')].filter((b,k)=>!G.opts[k].ok);shuffle(wrong).slice(0,2).forEach(b=>b.classList.add('gone'))};
$('pw-double').onclick=()=>{if(G.locked||!G.power.double)return;G.power.double=0;G.dbl=true;$('pw-double').disabled=true;$('pw-double').classList.add('active');tune([600,900],.08)};
$('pw-freeze').onclick=()=>{if(G.locked||!G.power.freeze)return;G.power.freeze=0;G.frozen=true;$('pw-freeze').disabled=true;$('pw-freeze').classList.add('active');$('timer').classList.add('frozen');tune([1200,900,600],.06,'sine');setTimeout(()=>{if(G){G.frozen=false;G.last=performance.now();$('timer').classList.remove('frozen')}},5000)};

function update(){
  const now=performance.now();if(!G.frozen)G.elapsed+=(now-G.last)/1000;G.last=now;
  const L=G.M.time,left=Math.max(0,L-G.elapsed),s=Math.ceil(left),t=$('timer');
  if(t.textContent!=s){t.textContent=s;if(s<=3&&s>0&&!G.frozen)beep(880,.06,'square',.06)}
  t.classList.toggle('low',s<=3&&!G.frozen);$('bar').style.width=(left/L*100)+'%';
  if(left<=0)answer(-1);
}
function answer(k){
  if(G.locked)return;G.locked=true;clearInterval(tick);stopMusic();
  const q=G.q,ok=k>=0&&G.opts[k].ok,L=G.M.time;
  let pts=0;
  if(ok){G.streak++;G.right++;G.best=Math.max(G.best,G.streak);pts=Math.round(1000*(1-Math.min(G.elapsed,L)/L/2));pts+=Math.min(G.streak-1,5)*100;if(G.dbl)pts*=2;G.score+=pts}
  else{G.streak=0;if(G.M.lives)G.lives--}
  markSeen(q.id);
  const correctTxt=G.opts.find(o=>o.ok).txt;
  G.log.push({q,ok,correctTxt});
  document.querySelectorAll('.ans').forEach((b,j)=>{b.disabled=true;if(G.opts[j].ok)b.classList.add('right');else{b.classList.add('dim');if(j===k)b.classList.add('wrong')}});
  ok?tune([523,659,784,1047]):tune([392,330,262],.13,'sawtooth');
  setTimeout(()=>{
    const f=$('fb');f.className=ok?'ok on':'no on';
    $('fbTitle').textContent=ok?CHEERS[Math.random()*CHEERS.length|0]:(k<0?"Time's up! ⏰":OOPS[Math.random()*OOPS.length|0]);
    $('fbPts').textContent=ok?`+ ${pts.toLocaleString()}${G.dbl?' (x2!)':''}${G.streak>1?'  🔥'+G.streak:''}`:'Answer: '+correctTxt;
    $('fbFact').textContent=q.f||'';
    const r=rankFor(G.score);$('fbRank').textContent=`${G.score.toLocaleString()} pts · All-time rank #${r}`;
    if(ok&&G.streak>=3&&G.streak%3===0)confetti(60);
    setTimeout(()=>{f.className='';G.i++;const over=(G.M.lives&&G.lives<=0)||G.i>=G.qs.length;over?end():ask()},ok?2200:2800);
  },700);
}

/* ================= LEADERBOARD ================= */
function boardKey(m){return m}
function getBoard(m){return (store.get('board',{})[boardKey(m)]||[])}
function rankFor(score){return getBoard(mode).filter(e=>e.score>score).length+1}
function saveScore(e){const all=store.get('board',{});const b=(all[boardKey(mode)]||[]);b.push(e);b.sort((a,c)=>c.score-a.score);all[boardKey(mode)]=b.slice(0,50);store.set('board',all);return all[boardKey(mode)].indexOf(e)+1}
function rowsHtml(list,meTs){if(!list.length)return '<div class="row"><span class="n" style="text-align:center">No scores yet — be the first! 🇱🇧</span></div>';return list.slice(0,10).map((e,i)=>`<div class="row ${e.ts===meTs?'me':''}" style="animation-delay:${i*.05}s"><span class="r">${['🥇','🥈','🥉'][i]||i+1}</span><span class="n">${esc(e.name)}<small>${CATS[e.cat]||''} · ${e.right}/${e.total} · 🔥${e.best} · ${new Date(e.ts).toLocaleDateString()}</small></span><span class="s">${e.score.toLocaleString()}</span></div>`).join('')}
let hofMode='classic';
function openHof(m){hofMode=m;$('hofTabs').innerHTML=Object.entries(MODES).map(([k,v])=>`<span class="chip ${k===m?'sel':''}" data-m="${k}">${v.icon} ${v.name}</span>`).join('');$('hofTabs').querySelectorAll('.chip').forEach(c=>c.onclick=()=>openHof(c.dataset.m));$('hofBoard').innerHTML=rowsHtml(getBoard(m));show('s-hof')}

/* ================= END ================= */
function end(){
  stopMusic();
  const total=G.log.length,acc=total?G.right/total:0;
  const entry={name:G.name,score:G.score,right:G.right,total,best:G.best,cat,ts:Date.now()};
  const rank=saveScore(entry);
  const st=store.get('stats',{games:0,right:0,total:0,best:0});st.games++;st.right+=G.right;st.total+=total;st.best=Math.max(st.best,G.best);store.set('stats',st);
  $('endTitle').textContent=`${G.M.icon} ${G.M.name} · ${CATS[cat]} · Final score`;
  animateNum($('final'),G.score);
  $('verdict').textContent=`${G.name}: ${G.right}/${total} correct — `+(acc===1?'100% Lebnene! 🇱🇧👑':acc>=.8?'Wlek, legend! 🔥':acc>=.6?'Not bad ya habibi! 👏':acc>=.4?'Teta says: study more 📚':'Are you sure you\'re Lebanese? 😂');
  const badges=[];
  if(rank===1)badges.push('👑 New #1 all-time!');else if(rank<=3)badges.push(`🏅 Top 3 all-time (#${rank})`);else if(rank<=10)badges.push(`⭐ Top 10 (#${rank})`);
  if(acc===1&&total>=5)badges.push('💯 Perfect game');
  if(G.best>=5)badges.push(`🔥 ${G.best} in a row`);
  if(G.power.half&&G.power.double&&G.power.freeze)badges.push('🧠 No power-ups used');
  if(G.M.lives&&total>=20)badges.push('💀 Survivor: 20+ questions');
  $('badges').innerHTML=badges.map((b,i)=>`<span class="badge" style="animation-delay:${.3+i*.15}s">${b}</span>`).join('');
  $('endBoard').innerHTML=rowsHtml(getBoard(mode),entry.ts)+(rank>10?`<div class="row me"><span class="r">${rank}</span><span class="n">${esc(G.name)}</span><span class="s">${G.score.toLocaleString()}</span></div>`:'');
  $('review').innerHTML=G.log.map((l,j)=>`<div>${l.ok?'✅':'❌'} ${j+1}. ${esc(l.q.q)} → <b>${esc(l.correctTxt)}</b></div>`).join('');
  show('s-end');
  if(rank<=3||acc>=.8){confetti(260);tune([523,659,784,1047,784,1047,1319],.12)}else tune([392,523,659,523],.15);
}
function animateNum(el,to){const t0=performance.now(),d=1200;(function f(t){const p=Math.min(1,(t-t0)/d);el.textContent=Math.round(to*(1-Math.pow(1-p,3))).toLocaleString();if(p<1)requestAnimationFrame(f)})(t0)}

renderHome();
</script>
